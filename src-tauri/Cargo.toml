[package]
name = "prompt-dock"
version = "0.1.2"
description = "A local prompt library and quick-send panel for Windows"
authors = ["PromptDock"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "prompt_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_Variant", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
